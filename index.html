<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stockbot Simulation</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --fg: #111;
      --panel: #fff;
      --card: #eaeaea;
      --accent-strong: #007bff;
      --font-size: 14px;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --fg: #eee;
      --panel: #1e1e1e;
      --card: #2a2a2a;
      --accent-strong: #1faaff;
      --font-size: 16px;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      font-size: var(--font-size);
    }
    h1 {
      margin: 0 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
    }
    #theme-toggle {
      padding: 6px 12px;
      background: var(--accent-strong);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #controls {
      background: var(--panel);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 900px;
    }
    label { margin-right: 4px; }
    input, button {
      padding: 6px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }
    button { background: var(--accent-strong); color: white; cursor: pointer; }
    #console {
      background: var(--panel);
      padding: 20px;
      height: 350px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      border-radius: 8px;
      box-shadow: inset 0 0 10px #0003;
      margin-bottom: 20px;
    }
    #stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      flex: 1 1 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--accent-strong);
    }
    .card p {
      margin: 0;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>
    Stockbot Simulation
    <button id="theme-toggle">Toggle Theme</button>
  </h1>

  <div id="controls">
    <div>
      <label for="symbol">Stock Symbol:</label>
      <input type="text" id="symbol" value="BTC">
    </div>

    <div>
      <label for="cash">Starting Cash: $</label>
      <input type="number" id="cash" value="40" min="1">
    </div>

    <button onclick="start()">Run 1-Day Test</button>
  </div>

  <div id="console">[ Ready… ]</div>

  <div id="stats">
    <div class="card"><h3>Net Gain</h3><p id="stat-net">—</p></div>
    <div class="card"><h3>Final Value</h3><p id="stat-value">—</p></div>
    <div class="card"><h3>Trade Income</h3><p id="stat-income">—</p></div>
    <div class="card"><h3>Total Spent</h3><p id="stat-spent">—</p></div>
  </div>

  <script>
    const consoleDiv = document.getElementById("console");
    const log = msg => {
      consoleDiv.textContent += msg + "\n";
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    };

    const stats = {
      net: document.getElementById("stat-net"),
      value: document.getElementById("stat-value"),
      income: document.getElementById("stat-income"),
      spent: document.getElementById("stat-spent"),
    };

    async function start() {
      consoleDiv.textContent = "[ Fetching 1-day history… ]";
      const symbol = document.getElementById("symbol").value.toUpperCase();
      const startingCash = parseFloat(document.getElementById("cash").value);
      const url = `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1d&interval=1m`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const ts = data.chart.result[0].timestamp;
        const cl = data.chart.result[0].indicators.quote[0].close;
        const entries = ts.map((t,i) => ({
          time: new Date(t*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
          price: cl[i]
        })).filter(e=>e.price);

        simulate(entries, startingCash);
      } catch (e) {
        log("Error fetching data: " + e.message);
      }
    }

function simulate(data, startCash) {
  let cash = startCash, shares = 0, boughtAt = 0, income = 0, spent = 0;
  const initialPrice = data[0].price;

  for (let i = 1; i < data.length; i++) {
    const cur = data[i], prev = data[i - 1];

    // BUY: Price is below initial and no shares held
    if (shares === 0 && cash > 0 && cur.price < initialPrice) {
      shares = cash / cur.price;
      boughtAt = cur.price;
      spent += cash;
      log(`[${cur.time}] BUY @ $${cur.price.toFixed(2)} | Shares: ${shares.toFixed(4)}`);
      cash = 0;
    }

    // SELL: Price above initial and just started to drop
    else if (shares > 0 && cur.price > initialPrice && cur.price < prev.price) {
      cash = shares * cur.price;
      const profit = (cur.price - boughtAt) * shares;
      income += profit;
      log(`[${cur.time}] SELL @ $${cur.price.toFixed(2)} | Profit: $${profit.toFixed(2)}`);
      shares = 0;
    }

    // HOLD: Still holding and conditions not met to sell
    else if (shares > 0) {
      log(`[${cur.time}] HOLD @ $${cur.price.toFixed(2)}`);
    }
  }

  const lastPrice = data[data.length - 1].price;
  const finalVal = cash + shares * lastPrice;
  const net = finalVal - startCash;

  log(`\n=== FINAL VALUE: $${finalVal.toFixed(2)} | NET GAIN: $${net.toFixed(2)} | INCOME: $${income.toFixed(2)} | SPENT: $${spent.toFixed(2)} ===`);

  stats.net.textContent    = `$${net.toFixed(2)}`;
  stats.value.textContent  = `$${finalVal.toFixed(2)}`;
  stats.income.textContent = `$${income.toFixed(2)}`;
  stats.spent.textContent  = `$${spent.toFixed(2)}`;
}




    // Theme toggle
    const themeBtn = document.getElementById("theme-toggle");
    themeBtn.onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    };
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>
</body>
</html>
